# ═══════════════════════════════════════════════════════════════════
#  CI для ai-dev loop. Положите в репозиторий как:
#     .github/workflows/ci.yml
#
#  Два уровня проверок:
#   • checks   — сборка + unit-тесты + lint. Быстро (~5–10 мин),
#                гоняется на КАЖДЫЙ push в PR. Именно этот job
#                оркестратор ждёт через `gh pr checks --watch`.
#   • emulator — инструментальные тесты на Android-эмуляторе.
#                Работает на БЕСПЛАТНОМ ubuntu-runner (KVM доступен),
#                но job долгий (~15–25 мин) и ест лимит минут, поэтому
#                включается только меткой `emulator` на PR.
# ═══════════════════════════════════════════════════════════════════
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Сборка и unit-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (с кэшем)
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка + тесты + lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      # ── VPN-часть ────────────────────────────────────────────────
      # TODO: подставьте проверку своего VPN-модуля, например:
      #   ./gradlew --no-daemon :vpn:test
      # или собственный smoke-скрипт:
      #   ./scripts/vpn-smoke-test.sh

  emulator:
    name: Тесты на эмуляторе (по метке "emulator")
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 45
    # Запускается ТОЛЬКО если на PR висит метка "emulator" —
    # чтобы не сжигать бесплатные минуты на каждой итерации.
    if: contains(github.event.pull_request.labels.*.name, 'emulator')
    steps:
      - name: Включить KVM (аппаратное ускорение на бесплатном runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (с кэшем)
        uses: gradle/actions/setup-gradle@v4

      - name: Инструментальные тесты
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest
