# ═══════════════════════════════════════════════════════════════════
#  Workflow для @claude в ПУБЛИЧНОМ android-репозитории.
#  Положить как: .github/workflows/claude.yml
#  (если workflow от @claude App уже есть — сверьте с ним и оставьте
#   один; КРИТИЧНА строка github.actor — см. ниже)
#
#  Секрет (один раз):
#    gh secret set CLAUDE_CODE_OAUTH_TOKEN -R jack5505/mahalla-android
#    (вставить токен из `claude setup-token`)
# ═══════════════════════════════════════════════════════════════════
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # ═══ ЗАЩИТА ДЛЯ ПУБЛИЧНОГО РЕПО ═══
    # Реагируем ТОЛЬКО на упоминания от владельца. Без этой строки
    # любой прохожий сможет командовать агентом и жечь вашу подписку.
    if: |
      github.actor == 'jack5505' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
